<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Euro 2016 Simulator</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="container mt-4">
    <h1 class="text-center mb-4">Euro 2016 Simulator</h1>
        
        <div class="row">
            <!-- Group Stage -->
            <div class="col-12">
                <h2>Group Stage</h2>
                <div class="groups-container">
                    {% for group, teams in groups.items() %}
                    <div class="group-section mb-4">
                        <h3>Group {{ group }}</h3>
                        <table class="table table-striped" id="group{{ group }}Table">
                            <thead>
                                <tr>
                                    <th>Team</th>
                                    <th>Pts</th>
                                    <th>Pld</th>
                                    <th>W</th>
                                    <th>D</th>
                                    <th>L</th>
                                    <th>GF</th>
                                    <th>GA</th>
                                    <th>GD</th>
                                </tr>
                            </thead>
                            <tbody>
                            </tbody>
                        </table>
                        
                        <div class="matches-container" id="group{{ group }}Matches">
                            <!-- Jogos serão inseridos aqui via JavaScript -->
                        </div>
                    </div>
                    {% endfor %}
                </div>
            </div>
        </div>

        <!-- Knockout controls (footer) -->
        <hr class="mt-4">
        <div class="row mb-3">
            <div class="col-md-8">
                <h2 class="mb-2">Knockout</h2>
                <p id="knockoutHint" class="text-muted mb-2">Complete all group stage matches to enable the knockout bracket.</p>
            </div>
            <div class="col-md-4">
                <div class="d-grid gap-2">
                    <button id="generateKO" class="btn btn-primary" disabled>Generate knockout</button>
                    <button id="resetAllBtn" class="btn btn-danger">Reset tournament</button>
                </div>
            </div>
        </div>
        <div id="knockoutStage" class="mb-4">
            <!-- Bracket will render here when enabled -->
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
    <!-- Bootstrap dos grupos para fallback no front-end -->
    <script id="bootstrapGroups" type="application/json">{{ groups | tojson }}</script>
    <script src="{{ url_for('static', filename='script.js') }}"></script>
</body>
</html>
